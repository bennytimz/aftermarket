# Eval-set build (PLAN.md §5, §13.3). Run: python -m aftermarket.data --config configs/data.yaml
# Every source is pinned to a commit / dataset revision; outputs are deterministic for a fixed seed.
seed: 42
out_dir: data/splits
seed_dir: data/seeds            # raw downloads (gitignored)

sources:
  # HarmBench / AdvBench: the authors' original MIT-licensed CSVs on GitHub, pinned by commit.
  # (The HF copies walledai/HarmBench and walledai/AdvBench are the same rows but gated.)
  harmbench:
    url: https://raw.githubusercontent.com/centerforaisafety/HarmBench/8e1604d1171fe8a48d8febecd22f600e462bdcdd/data/behavior_datasets/harmbench_behaviors_text_all.csv
    functional_category: standard   # contextual / copyright need extra context; excluded
  advbench:
    url: https://raw.githubusercontent.com/llm-attacks/llm-attacks/098262edf85f807224e70ecd87b9d83716bf6b73/data/advbench/harmful_behaviors.csv
  xstest:        # official XSTest release by its authors
    hf_dataset: Paul/XSTest
    revision: f600c994b256f12867dfa5b3eb3d545a3e62f8b5
    file: xstest_prompts.csv
  mmlu:
    hf_dataset: cais/mmlu
    revision: c30699e8356da336a370243923dbaf21066bb9fe
    test_file: all/test-00000-of-00001.parquet
    dev_file: all/validation-00000-of-00001.parquet
  orbench:       # OR-Bench-Hard-1K: benign but refusal-prone prompts (over-refusal dev set)
    hf_dataset: bench-llm/or-bench
    revision: e36d8b80e81837c8a8f264bbb2a49f1b32c7e272
    file: or-bench-hard-1k.csv
  alpaca:        # harmless side of the calibration contrast set
    hf_dataset: tatsu-lab/alpaca
    revision: dce01c9b08f87459cf36a430d809084718273017
    file: data/train-00000-of-00001-a09b74b3ef9c3b56.parquet

curation:        # CuratorKIT steps
  clean_transforms: {strip_html: false}   # keep tag-shaped text in safety prompts
  minhash_threshold: 0.7                   # AdvBench has many near-paraphrases
  alpaca_words: [4, 30]                    # harmless calib prompts: no input field, 4-30 words

sizes:
  harmful_test: {harmbench: 100, advbench: 100}   # 200 held-out; HarmBench stratified by semantic category
  harmful_dev:  {harmbench: 50, advbench: 50}
  calib_pairs:  {harmbench: 32, advbench: 32}     # 64 harmful + 64 harmless (Alpaca)
  xstest_test: 250                                # all XSTest safe prompts
  mmlu_test: 300                                  # stratified by subject, from MMLU test
  mmlu_dev: 100                                   # stratified by subject, from MMLU validation
  benign_dev: 100                                 # OR-Bench-Hard-1K, stratified by category; deduped vs all splits

mmlu_prompt: |-
  The following is a multiple choice question about {subject}.

  {question}
  A. {A}
  B. {B}
  C. {C}
  D. {D}

  Answer with the letter only (A, B, C or D).

# Fine-tuning attack data (PLAN.md §4 A1/A2). Build: python -m aftermarket.ft_data --config configs/data.yaml
finetune:
  out_dir: data/ft
  seed: 4242                      # own RNG stream: the eval splits above are unaffected
  a1_alpaca: 1000                 # A1 benign: Alpaca (sources.alpaca), excluding the calib_pairs harmless IDs
  a2: {harmful: 100, benign: 900} # A2 = 100 harmful pairs + the first 900 A1 examples (same mix as SDT's threat model)
  harmful_source:                 # instruction -> compliant harmful response pairs
    hf_dataset: LLM-LAT/harmful-dataset
    revision: 8bfba31bc6d93a5b71808fee5275ef4b6330ed91
    file: data/train-00000-of-00001.parquet
    prompt_col: prompt
    response_col: rejected        # 'rejected' = the compliant (harmful) answer; 'chosen' is the refusal
  min_response_words: 30          # drop stub answers
  max_chars: 2000                 # prompt + response, so most examples fit max_len 512 tokens
  max_jaccard_vs_splits: 0.5      # char-3gram Jaccard vs EVERY eval/calib prompt, checked exhaustively
  # Harmful response text is never committed (PLAN.md §9): data/ft/ft_a2_spec.json stores row indices +
  # sha256; aftermarket.ft_data rebuilds the text from the pinned dataset at training time and verifies it.

# AM hardening data (PLAN.md §6.2). Build: python -m aftermarket.ft_data --safety-only
safety_train:
  out: data/ft/safety_train.jsonl
  seed: 4343
  harmful_refusals: 300   # LLM-LAT/harmful-dataset 'chosen' column = refusals; rows disjoint from A2's 100;
                          # prompts far from every eval/calib prompt and from A2's harmful prompts
  benign: 300             # Alpaca, not in A1/A2/calib, far from every eval/calib prompt and from A1's prompts
