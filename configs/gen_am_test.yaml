# The frozen AM through the full A0-A5 battery on test (PLAN.md §5-6). --final, and only after
# aftermarket.defense.select --stage freeze wrote configs/am_frozen.yaml (generate refuses otherwise).
# A4 at 3-bit only (team models keep A4q4/q3/q2). Controls run a smaller battery: configs/gen_am_controls_test.yaml.
#   PYTHONPATH=src python -m aftermarket.generate --config configs/gen_am_test.yaml --final --attacks A0,A3,A5raw
seed: 42
runs: [AM]
attacks: [A0, A3, A5raw, A4q3, A5bon, A1, A2]   # A4 at 3-bit only (quota; notes/limitations.md)
splits: [harmful_test, xstest_test, mmlu_test]
precision: fp16
batch_size: 16
max_new_tokens:
  default: 256
  mmlu: 8
gpus: [0, 1]
out_dir: results/gen
push:
  enabled: true
  hf_repo: aftermarket-runs
  path_in_repo: gen
