# AM controls on test (PLAN.md §6): only what shows whether the circuit matters on the attacks AM targets
# (A0, A2, A3; same splits as AM; no A4, notes/limitations.md). --final, only after the freeze (generate refuses otherwise).
#   PYTHONPATH=src python -m aftermarket.generate --config configs/gen_am_controls_test.yaml --final --attacks A0,A3
seed: 42
runs: [AM_rand0, AM_rand1, AM_all]
attacks: [A0, A3, A2]
splits: [harmful_test, xstest_test, mmlu_test]
precision: fp16
batch_size: 16
max_new_tokens:
  default: 256
  mmlu: 8
gpus: [0, 1]
out_dir: results/gen
push:
  enabled: true
  hf_repo: aftermarket-runs
  path_in_repo: gen
