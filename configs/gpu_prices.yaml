# GPU on-demand prices for the Stage 2 cost / ROI analysis (E2). USD per GPU-hour.
# Every price was read from the source page on the date given; nothing is estimated or invented.
# Where a provider does not list a GPU, it is absent here (not zero). Re-check before final numbers.
accessed: 2026-11-22
gpus:
  T4:                       # 16 GB (Turing). Our Kaggle / Colab hardware.
