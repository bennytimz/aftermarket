# AM selection, part 2 (PLAN.md §6, dev only): the selection attacks on harmful_dev (retention).
# A2 trains on each candidate as released (adapter merged); A4q3 applies the candidate's quant shield.
#   PYTHONPATH=src python -m aftermarket.generate --config configs/gen_defense_dev_attacks.yaml --attacks A3,A4q3   (then --attacks A2)
# Stage 2 adds the ReSta candidate with --runs <chosen>_r.
seed: 42
runs: [BASE, AMc_k4, AMc_k4s, AMc_k6, AMc_k6s, AMc_k8, AMc_k8s]
attacks: [A3, A4q3, A2]
splits: [harmful_dev]
precision: fp16
batch_size: 16
max_new_tokens:
  default: 256
  mmlu: 8
gpus: [0, 1]
out_dir: results/gen
push:
  enabled: true
  hf_repo: aftermarket-runs
  path_in_repo: gen
