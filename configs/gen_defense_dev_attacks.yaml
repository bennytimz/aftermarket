# AM selection, part 2 (PLAN.md §6, dev only): the selection attacks on harmful_dev (retention).
# A4q3 applies the candidate's quant shield. A2 is measured on test only (frozen AM).
#   PYTHONPATH=src python -m aftermarket.generate --config configs/gen_defense_dev_attacks.yaml 
seed: 42
runs: [BASE, AMc_k6, AMc_k6s]
attacks: [A3, A4q3]          # A2 is not in the selection loop (quota)
splits: [harmful_dev]
precision: fp16
batch_size: 16
max_new_tokens:
  default: 256
  mmlu: 8
gpus: [0, 1]
out_dir: results/gen
push:
  enabled: true
  hf_repo: aftermarket-runs
  path_in_repo: gen
