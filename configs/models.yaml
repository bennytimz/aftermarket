# Models under test (PLAN.md §3). Inventory verified on the HF Hub on 2026-11-13
# with huggingface_hub.model_info / list_repo_files: all repos public; revisions pinned to
# the commit seen then.
#
# status:  active | dropped (give drop_reason) | planned (ours, not built yet)
# format:  full | lora | deltas | gguf
# Tokenizer: ALWAYS the BASE tokenizer at base_revision (CLAUDE.md); load.py asserts each
# repo's own tokenizer (if shipped) produces identical token IDs.
# chat_template_file: the model's own template, if its repo ships one; else BASE's template.
# Rule: if a model can't be loaded within 30 minutes, drop it and note why.
#
# INVENTORY DONE (2026-11-13): notebooks/01_inventory_load.ipynb passed on Kaggle T4, all 8 runs
# (BASE, SDT, GC, IL, RL, RL_noguard, ST, SP) load and generate.

base_model: CohereLabs/tiny-aya-global
base_revision: &base_rev af89d219b53ed9b13b8a4645f9c8028973510324

# Model runs = a model + a chat-template variant. Each active model is a run with its own
# template ("native"); extra runs below. Run IDs name the parquet files in results/gen/.
runs:
  RL_noguard: {model: RL, template: base}   # RedLens with the guard template removed (PLAN.md §3)

models:
  BASE:
    name: Tiny Aya Global
    status: active
    hf_path: CohereLabs/tiny-aya-global
    revision: *base_rev
    fix_type: original
    format: full
    files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors, tokenizer.json]
    notes: Gated (auto-approve); accept the licence and log in with HF_TOKEN. ~6.7 GB bf16.

  SDT:
    name: Safety Doesn't Translate (one-shot repair, 1% setting)
    status: active
    hf_path: DhruvParmar051/tiny-aya-global-oneshot-repair
    revision: 2c6dc0224d1191b445677063f871c013e0d1eb4b
    fix_type: weight-space repair
    format: full
    base: BASE
    files: [model.safetensors, tokenizer.json, chat_template.jinja]
    chat_template_file: chat_template.jinja
    source: https://github.com/DhruvParmar051/safety-doesnt-translate
    notes: >-
      Drifted model repaired by copying back 1% of Global's weights. Their README headline numbers
      (5.7% harmful-reply rate) are for the 2% setting, but no 2% model is published: checked
      2026-11-13, the author's Hub models are oneshot-repair (1%), control-oneshot-repair (1% repair of
      the harmless control fine-tune), safety-ft-repair and the drifted checkpoints. So we test the 1%
      release (their README: 8.6%; also the model their own sections 5.5-5.6 use). Report this beside
      their row.

  GC:
    name: Guardián colombiano
    status: active
    hf_path: vasmi-sas/guardian-tiny-aya-lisa
    revision: 4314ffb7bda0b02762fc4f4a49c8059b7e3cba46
    fix_type: Lisa hardening
    format: lora
    base: BASE
    files: [adapter_config.json, adapter_model.safetensors, tokenizer.json, chat_template.jinja]
    chat_template_file: chat_template.jinja
    notes: LoRA r=16, alpha=32, all attn+MLP projections. Adapter pins base revision af89d219. Ships its own (short) chat template.

  IL:
    name: Intentlock (signers-doubt)
    status: active
    hf_path: Sykeclonex/signers-doubt-tiny-aya-hardened
    revision: e3fdda20724d3707bf9436bf11ebd7ed4b43bb83
    fix_type: SafeGrad hardening
    format: lora
    base: BASE
    files: [adapter_config.json, adapter_model.safetensors, tokenizer.json, chat_template.jinja]
    chat_template_file: chat_template.jinja
    notes: LoRA r=16, alpha=32, all attn+MLP projections. Adapter does not pin a base revision; we use af89d219.

  RL:
    name: RedLens guard
    status: active
    hf_path: AmberNeel/tiny-aya-global-redlens-guard-GGUF
    revision: 1fa534c8bebadd2af00c480b6ecd9d1db762d217
    fix_type: prompt guard in template
    format: template  # BASE weights + this repo's chat template
    base: BASE
    files: [tiny-aya-global-redlens-guard-Q4_K_M.gguf, chat_template_redlens_guard.jinja]
    chat_template_file: chat_template_redlens_guard.jinja
    notes: >-
      Loaded as BASE weights (HF, af89d219) + the RedLens guard chat template, not via the GGUF.
      Their README: "Weights are unchanged; only tokenizer.chat_template and the model name/description
      metadata differ from the plain Q4_K_M file", so the whole fix is the guard text and Q4_K_M is only
      packaging. 4-bit is covered for every model by our A4 compression attack, and the HF path keeps RL
      on the same loader, tokenizer and decoding as the others. Verified 2026-11-13: the
      tokenizer.chat_template in the GGUF metadata is byte-identical to chat_template_redlens_guard.jinja
      (4,862 bytes). Runs: template="native" (guard on) and template="base" (guard removed = BASE's template).

  ST:
    name: ScarTissue
    status: active
    hf_path: amugoodbad229/scartissue-tinyaya-repair-parameters
    revision: 6641a1902a68a73eb770b38cb465aac62204aa3d
    fix_type: rank-one repair
    format: deltas
    base: BASE
    files: [abliteration_tiny-aya-global_layer15.npz, repair_harm2_a4.npz, repair_harm4_a4.npz,
            repair_harm10_a4.npz, repair_global_a4.npz, load_patch.py, manifest.json]
    # Their repairs restore an abliterated ("drifted") model, so the released fix = BASE + drift + repair.
    # The drifted state exists only in memory and is never saved or published (PLAN.md §9).
    delta_files: [abliteration_tiny-aya-global_layer15.npz, repair_harm2_a4.npz]
    source: https://github.com/amugoodbad229/scartissue
    notes: >-
      Rank-one patches (scartissue.rank1-patch/1), alpha=-1 drift then alpha=4 repair. Neither README
      recommends a repair to ship (checked 2026-11-13). repair_harm2_a4 (2% support) is the "Sparse repair"
      row in their GitHub README headline table (results/p16_capability_analysis_20261102.json: GSM8K
      51.8%), so it's the fair pick; global_a4 is their full-support comparator. load.py reimplements their
      validated loader (artifacts/load_patch.py) instead of executing the downloaded script.

  SP:
    name: SafetyPulse (repaired)
    status: active
    hf_path: purvansh01/tiny-aya-global-safetypulse-repaired
    revision: d290c316d4e653657782b56396caa5cc9b51ef28
    fix_type: SafeTune repair
    format: full
    base: BASE
    files: [model.safetensors, tokenizer.json, chat_template.jinja]
    chat_template_file: chat_template.jinja
    notes: >-
      Alpaca LoRA (drifted) merged, then safetune.apply_safety_vector_restore (rank 8). Built in fp16.
      Its tokenizer.json is 154 bytes larger than BASE's; the token-ID assert in load.py checks it.

  # Our defense (PLAN.md §6). Placeholders until frozen: aftermarket.defense.select --stage freeze writes
  # configs/am_frozen.yaml (pinned private-Hub revision, L*, recipe, quant shield), which load_registry merges
  # in, turning these into active models for the A0-A5 battery (--final). Dev candidates (AMc_*) come from
  # local defense folders and are never in the leaderboard.
  AM:
    name: Aftermarket-hardened (ours)
    status: planned
    hf_path: TODO  # filled by am_frozen.yaml
    fix_type: combined
    format: lora
    base: BASE
  AM_rand0: {name: "AM control: random layers (seed 0)", status: planned, format: lora, base: BASE}
  AM_rand1: {name: "AM control: random layers (seed 1)", status: planned, format: lora, base: BASE}
  AM_rand2: {name: "AM control: random layers (seed 2)", status: planned, format: lora, base: BASE}
  AM_all: {name: "AM control: SafeGrad on all layers", status: planned, format: lora, base: BASE}

optional:
  RELAPSE:
    name: Relapse (unlearning)
    status: planned
    hf_path: TODO
    notes: Separate table. Attack is relearning; metric is WMDP-bio recovery.
